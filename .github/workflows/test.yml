name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: ["v0.11.0", "stable", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Clone plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim "${{ runner.temp }}/plenary"

      - name: Run tests
        run: make test PLENARY="${{ runner.temp }}/plenary"
